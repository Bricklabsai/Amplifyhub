name: Build and deploy Next.js app to Azure Web App - Amplifyhub

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # ✅ Install pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # ✅ Install deps using pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ✅ Prisma
      - name: Generate Prisma client
        run: pnpm prisma generate

      # ✅ Build
      - name: Build app
        run: pnpm build

      # ✅ Prepare output
      - name: Prepare deployment package
        run: |
          mkdir output
          cp -r .next output/.next
          cp -r public output/public
          cp -r prisma output/prisma
          cp package.json output/package.json
          cp pnpm-lock.yaml output/pnpm-lock.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: output

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install production deps
        run: pnpm install --prod --frozen-lockfile

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E32F78D60C445C88A49502E8BB3499E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8D389E073F494A96ADDEE90DE67F9AF9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4AC0BEEBFB3C4AECA6392329FB44874F }}

      - name: Run Prisma migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Amplifyhub'
          slot-name: 'Production'
          package: .
