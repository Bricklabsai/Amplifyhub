name: Build and deploy Next.js app to Azure Web App - Amplifyhub

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Matches next.config.js production distDir default (BUILD_DIR || '.next-build')
   NEXT_DIST_DIR: .next

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Next.js
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYNOW_INTEGRATION_ID: ${{ secrets.PAYNOW_INTEGRATION_ID }}
          PAYNOW_INTEGRATION_KEY: ${{ secrets.PAYNOW_INTEGRATION_KEY }}
          NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}

      - name: Prepare Standalone Artifact (Azure-safe)
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="${NEXT_DIST_DIR}"
          STANDALONE_DIR="${DIST_DIR}/standalone"
          DEPLOY_DIR="${DIST_DIR}/deploy"

          echo "Using distDir: ${DIST_DIR}"
          ls -la "${DIST_DIR}" || true

          if [ ! -d "${STANDALONE_DIR}" ]; then
            echo "ERROR: ${STANDALONE_DIR} not found. Ensure next.config.js has output: 'standalone'."
            exit 1
          fi

          echo "Copying static assets..."

          # Static assets
          mkdir -p "${STANDALONE_DIR}/.next/static"

          if [ -d "${DIST_DIR}/static" ]; then
             echo "Found static assets in ${DIST_DIR}/static"
             cp -R "${DIST_DIR}/static/"* "${STANDALONE_DIR}/.next/static/" || true
          else
             echo "ERROR: No static assets found in ${DIST_DIR}/static"
             ls -la "${DIST_DIR}"
          exit 1
          fi

          # Public assets
          if [ -d "public" ]; then
            cp -R public "${STANDALONE_DIR}/public"
          fi

          # Prisma engines (only if present)
          if [ -d "node_modules/.prisma" ]; then
            mkdir -p "${STANDALONE_DIR}/node_modules/.prisma"
            cp -R node_modules/.prisma/* "${STANDALONE_DIR}/node_modules/.prisma/" || true
          else
            echo "No node_modules/.prisma directory found; skipping Prisma engine copy."
          fi

          # IMPORTANT:
          # If a node_modules.tar.gz is deployed, Azure App Service will extract it to /node_modules
          # and set NODE_PATH=/node_modules, which can break pnpm layouts (e.g. /node_modules/next shim).
          if [ -f "${STANDALONE_DIR}/node_modules.tar.gz" ]; then
            echo "Removing ${STANDALONE_DIR}/node_modules.tar.gz to prevent Azure /node_modules injection..."
            rm -f "${STANDALONE_DIR}/node_modules.tar.gz"
          fi

          # Build deployment directory from standalone output.
          rm -rf "${DEPLOY_DIR}"
          mkdir -p "${DEPLOY_DIR}"
          cp -R "${STANDALONE_DIR}/." "${DEPLOY_DIR}/"

          # Rebuild runtime deps in a classic hoisted node_modules layout so
          # Azure tar/extract startup behavior does not rely on pnpm symlink graphs.
          rm -rf "${DEPLOY_DIR}/node_modules"
          cp pnpm-lock.yaml "${DEPLOY_DIR}/pnpm-lock.yaml"
          (
            cd "${DEPLOY_DIR}"
            pnpm install --prod --frozen-lockfile --node-linker=hoisted
          )

          # Defensive cleanup in case any tarball or stale Oryx files are present.
          find "${DEPLOY_DIR}" -name "node_modules.tar.gz" -type f -delete || true
          rm -f "${DEPLOY_DIR}/oryx-manifest.toml" || true

          echo "Standalone package contents:"
          ls -la "${STANDALONE_DIR}" || true

          echo "Deploy package contents:"
          ls -la "${DEPLOY_DIR}" || true

          echo "Verifying required runtime files exist..."
          test -f "${DEPLOY_DIR}/server.js"
          test -f "${DEPLOY_DIR}/package.json"
          test -d "${DEPLOY_DIR}/node_modules/next"
          test -f "${DEPLOY_DIR}/node_modules/styled-jsx/package.json"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E32F78D60C445C88A49502E8BB3499E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8D389E073F494A96ADDEE90DE67F9AF9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4AC0BEEBFB3C4AECA6392329FB44874F }}

      - name: Configure Web App Startup (disable Oryx)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            APP_NAME="Amplifyhub"
            RG_NAME="$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup | [0]" -o tsv)"

            if [ -z "${RG_NAME}" ]; then
              echo "ERROR: Could not resolve resource group for app ${APP_NAME}."
              exit 1
            fi

            echo "Configuring app ${APP_NAME} in resource group ${RG_NAME}"

            # Disable server-side build behavior and force standalone entrypoint.
            az webapp config appsettings set \
              --name "${APP_NAME}" \
              --resource-group "${RG_NAME}" \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

            az webapp config set \
              --name "${APP_NAME}" \
              --resource-group "${RG_NAME}" \
              --startup-file "node server.js"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Amplifyhub
          slot-name: Production
          clean: true
          package: ${{ env.NEXT_DIST_DIR }}/deploy
