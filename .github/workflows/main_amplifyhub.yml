name: Build and deploy Next.js app to Azure Web App - Amplifyhub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm' # Speeds up subsequent runs

      - name: Install dependencies
        run: npm ci # Faster and more reliable than 'npm install' for CI

      - name: Generate Prisma Client
        run: npx prisma generate # Critical for Next.js + Prisma

      - name: Build Next.js
        run: npm run build
        env:
          # If your build needs the DB URL (e.g. for static generation)
          DATABASE_URL: ${{ secrets.DATABASE_URL }} 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Only upload what's needed for production to save time/space
          path: |
            .next
            public
            package.json
            package-lock.json
            prisma
            next.config.js

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E32F78D60C445C88A49502E8BB3499E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8D389E073F494A96ADDEE90DE67F9AF9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4AC0BEEBFB3C4AECA6392329FB44874F }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Amplifyhub'
          slot-name: 'Production'
          package: .
