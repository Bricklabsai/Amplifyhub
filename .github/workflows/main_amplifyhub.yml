name: Build and deploy Next.js app to Azure Web App - Amplifyhub

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Matches next.config.js production distDir default (BUILD_DIR || '.next-build')
  NEXT_DIST_DIR: ${{ vars.BUILD_DIR || '.next-build' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Next.js
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Prepare Standalone Artifact
        shell: bash
        run: |
          set -euo pipefail

          DIST_DIR="${NEXT_DIST_DIR}"

          echo "Using distDir: ${DIST_DIR}"
          echo "Listing output:"
          ls -la
          ls -la "${DIST_DIR}" || true

          # Verify standalone folder exists
          if [ ! -d "${DIST_DIR}/standalone" ]; then
            echo "ERROR: ${DIST_DIR}/standalone not found. Ensure next.config.js has output: 'standalone'."
            exit 1
          fi

          # Ensure expected dirs exist inside standalone bundle
          mkdir -p "${DIST_DIR}/standalone/.next"

          # Copy static assets only if they exist
          if [ -d "${DIST_DIR}/static" ]; then
            mkdir -p "${DIST_DIR}/standalone/.next/static"
            cp -R "${DIST_DIR}/static/"* "${DIST_DIR}/standalone/.next/static/" || true
          else
            echo "No ${DIST_DIR}/static directory found; skipping static copy."
          fi

          # Public assets
          if [ -d "public" ]; then
            cp -R public "${DIST_DIR}/standalone/public"
          fi

          # Prisma engines (only if present)
          if [ -d "node_modules/.prisma" ]; then
            mkdir -p "${DIST_DIR}/standalone/node_modules/.prisma"
            cp -R node_modules/.prisma/* "${DIST_DIR}/standalone/node_modules/.prisma/"
          else
            echo "No node_modules/.prisma directory found; skipping Prisma engine copy."
          fi

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.NEXT_DIST_DIR }}/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E32F78D60C445C88A49502E8BB3499E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8D389E073F494A96ADDEE90DE67F9AF9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4AC0BEEBFB3C4AECA6392329FB44874F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Amplifyhub
          slot-name: Production
          package: .
